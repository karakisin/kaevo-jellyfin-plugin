name: Kaevo AWS identity verification

on:
  workflow_dispatch:
  push:
    branches:
      - migration/aws-cost-architecture-20260902
    paths:
      - .github/workflows/kaevo-aws-identity.yml
      - Kaevo Cloud/infra/security-baseline.yaml

permissions:
  contents: read
  id-token: write

jobs:
  verify-temporary-deployment-role:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure temporary AWS role credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.KAEVO_AWS_DEPLOYMENT_ROLE_ARN }}
          role-session-name: kaevo-github-identity-verification
          mask-aws-account-id: true

      - name: Verify assumed role without printing account identifiers
        shell: bash
        run: |
          set -euo pipefail
          caller_arn=$(aws sts get-caller-identity --query Arn --output text)
          if [[ "$caller_arn" != */KaevoDeploymentRole/* ]]; then
            echo "Unexpected AWS identity" >&2
            exit 1
          fi
          echo "Verified temporary KaevoDeploymentRole session"
