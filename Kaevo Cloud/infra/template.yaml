    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/kaevo-cloud-${EnvironmentName}-owner-enrollment-promotion-v2
      RetentionInDays: 30

