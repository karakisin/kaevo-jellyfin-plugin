  KaevoIdentityClaimIssuerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref KaevoIdentityClaimIssuerFunction
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

  KaevoSocialIdentityGuardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kaevo-cloud-${EnvironmentName}-social-identity-guard
      CodeUri: ../api/social_identity_guard/
      Handler: social_identity_guard.lambda_handler
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          EXPECTED_USER_POOL_ID: !Ref SocialIdentityUserPoolId
      Policies:
        - AWSLambdaBasicExecutionRole
        - !If
          - HasSocialIdentityUserPoolId
          - Statement:
              - Sid: BlockExistingEmailFederatedDuplicates
                Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${SocialIdentityUserPoolId}
          - !Ref AWS::NoValue
      Tags:
        KaevoSecurityBoundary: social-identity-collision-guard

  KaevoSocialIdentityGuardPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref KaevoSocialIdentityGuardFunction
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !If
        - HasSocialIdentityUserPoolId
        - !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${SocialIdentityUserPoolId}
        - !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/disabled-social-identity-guard

  KaevoOwnerEnrollmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kaevo-cloud-${EnvironmentName}-owner-enrollment
      CodeUri: ../api/src/
      Handler: identity_enrollment.lambda_handler
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          KAEVO_ENV: !Ref EnvironmentName
          ACCOUNTS_TABLE: !Ref KaevoAccountsTable
          AUTH_IDENTITIES_TABLE: !Ref KaevoAuthIdentitiesTable
          PRINCIPALS_TABLE: !Ref KaevoPrincipalsTable
          IDENTITY_MEMBERSHIPS_TABLE: !Ref KaevoIdentityMembershipsTable
          IDENTITY_HOUSEHOLDS_TABLE: !Ref KaevoIdentityHouseholdsTable
          IDENTITY_PROFILES_TABLE: !Ref KaevoIdentityProfilesTable
          SECURITY_AUDIT_TABLE: !Ref KaevoSecurityAuditTable
          AUDIT_REFERENCE_SECRET_ARN: !Ref KaevoAuditReferenceSecret
          EXPECTED_COGNITO_ISSUER: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${KaevoUserPool}
          EXPECTED_ENROLLMENT_CLIENT_ID: !Ref KaevoEnrollmentUserPoolClient
          EXPECTED_NATIVE_CLIENT_ID: !If [HasNativeOidc, !Ref KaevoSecurityStageNativeOidcClient, ""]
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: BootstrapAuthoritativeIdentityGraph
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt KaevoPrincipalsTable.Arn
                - !GetAtt KaevoAccountsTable.Arn
                - !GetAtt KaevoAuthIdentitiesTable.Arn
                - !GetAtt KaevoIdentityMembershipsTable.Arn
                - !GetAtt KaevoIdentityHouseholdsTable.Arn
                - !GetAtt KaevoIdentityProfilesTable.Arn
                - !GetAtt KaevoSecurityAuditTable.Arn
            - Sid: ReadAuditReferenceKey
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref KaevoAuditReferenceSecret
      Events:
        EnrollOwner:
          Type: HttpApi
          Properties:
            ApiId: !Ref KaevoCloudHttpApi
            Path: /v2/identity/enroll-owner
            Method: POST
            Auth:
              Authorizer: KaevoEnrollmentAuthorizer
      Tags:
        KaevoSecurityBoundary: identity-owner-enrollment

