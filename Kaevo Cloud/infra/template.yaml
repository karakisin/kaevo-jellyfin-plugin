        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoProfileBindingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoProfileMappingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoPrincipalsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoIdentityMembershipsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoIdentityHouseholdsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoIdentityProfilesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoHouseholdInvitationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoInstallationsTable
        - Statement:
            - Sid: ConnectorLifecycleAndIdentityTransactions
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt KaevoHomeConnectorsTable.Arn
                - !GetAtt KaevoAppSessionsTable.Arn
                - !GetAtt KaevoSecurityAuditTable.Arn
                - !GetAtt KaevoAccountsTable.Arn
                - !GetAtt KaevoAuthIdentitiesTable.Arn
                - !GetAtt KaevoHouseholdMembershipsTable.Arn
                - !GetAtt KaevoProfilesTable.Arn
                - !GetAtt KaevoProfileBindingsTable.Arn
                - !GetAtt KaevoProfileMappingsTable.Arn
                - !GetAtt KaevoPrincipalsTable.Arn
                - !GetAtt KaevoIdentityMembershipsTable.Arn
                - !GetAtt KaevoIdentityHouseholdsTable.Arn
                - !GetAtt KaevoIdentityProfilesTable.Arn
                - !GetAtt KaevoHouseholdInvitationsTable.Arn
                - !GetAtt KaevoEntitlementsTable.Arn
            - Sid: ReadAuditReferenceKey
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref KaevoAuditReferenceSecret
            - Sid: ReadPairingV3AuthorizationSigningKey
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref KaevoPairingV3AuthorizationSigningSecret
            - Sid: ManageExplicitSocialIdentityLinks
              Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminLinkProviderForUser
              Resource: !GetAtt KaevoUserPool.Arn
            - Sid: ReadConfiguredSocialIdentityProviderCredentials
