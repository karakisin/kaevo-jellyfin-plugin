AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Kaevo Cloud backend with production identity and sender-constrained sessions

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, security-stage, production]

  DevApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Non-production migration key. Ignored and omitted from the production function environment.

  PlaybackGrantSigningKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: HMAC signing key used for grants bound to paired Kaevo Jellyfin Plugin connectors

  PlaybackRelayPublicUrl:
    Type: String
    Default: ""
    Description: Public HTTPS origin of the separate long-lived Kaevo playback relay

  EnableInstallationSessionIndex:
    Type: String
    Default: "false"
    AllowedValues: ["false", "true"]
    Description: Enables the second bound-session GSI after the refresh-family index is active

  GoogleIdentityProviderSecretArn:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional Secrets Manager ARN for a JSON secret containing client_id and client_secret for Kaevo Google sign-in

  AppleIdentityProviderSecretArn:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional Secrets Manager ARN for a JSON secret containing client_id, team_id, key_id, and private_key for Kaevo Sign in with Apple

  SocialIdentityLinkCallbackUrl:
    Type: String
    Default: ""
    Description: Exact public HTTPS OAuth callback for the explicit existing-account social-link transaction

  SocialIdentityUserPoolId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9_-]+$"
    Description: Exact existing Cognito user-pool ID used to scope the isolated social identity guard

  CognitoCustomDomainName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?$"
    Description: Optional custom managed-login FQDN for the normal Kaevo authentication surface

  CognitoCustomDomainCertificateArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$"
    Description: Optional us-east-1 ACM certificate ARN for the custom Cognito managed-login domain

  ApiCustomDomainName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?$"
    Description: Optional regional API Gateway custom domain for the normal Kaevo API surface

  ApiCustomDomainCertificateArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws:acm:us-west-2:[0-9]{12}:certificate/[0-9a-f-]+$"
    Description: Optional us-west-2 ACM certificate ARN for the regional Kaevo API custom domain

Conditions:
  IsProduction: !Equals [!Ref EnvironmentName, production]
  IsDevelopment: !Equals [!Ref EnvironmentName, dev]
  IsSecurityStage: !Equals [!Ref EnvironmentName, security-stage]
  HasNativeOidc: !Or
    - !Condition IsDevelopment
    - !Condition IsSecurityStage
  HasInstallationSessionIndex: !Equals [!Ref EnableInstallationSessionIndex, "true"]
  HasSocialIdentityUserPoolId: !Not [!Equals [!Ref SocialIdentityUserPoolId, ""]]
  HasGoogleIdentityProvider: !And
    - !Condition HasNativeOidc
    - !Condition HasSocialIdentityUserPoolId
    - !Not [!Equals [!Ref GoogleIdentityProviderSecretArn, ""]]
  HasAppleIdentityProvider: !And
    - !Condition HasNativeOidc
    - !Condition HasSocialIdentityUserPoolId
    - !Not [!Equals [!Ref AppleIdentityProviderSecretArn, ""]]
  HasSocialIdentityProvider: !Or
    - !Condition HasGoogleIdentityProvider
    - !Condition HasAppleIdentityProvider
  HasCognitoCustomDomain: !And
    - !Condition HasNativeOidc
    - !Not [!Equals [!Ref CognitoCustomDomainName, ""]]
    - !Not [!Equals [!Ref CognitoCustomDomainCertificateArn, ""]]
  HasApiCustomDomain: !And
    - !Condition IsDevelopment
    - !Not [!Equals [!Ref ApiCustomDomainName, ""]]
    - !Not [!Equals [!Ref ApiCustomDomainCertificateArn, ""]]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 128
    Architectures:
      - arm64

Resources:
  KaevoCloudHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: dev
      DefaultRouteSettings:
        ThrottlingBurstLimit: 80
        ThrottlingRateLimit: 40
      RouteSettings:
        "POST /v1/trials/start":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        "POST /v1/trials/activate":
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 5
        "POST /v1/app-sessions/refresh":
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 2
        "POST /v2/identity/enroll-owner":
          ThrottlingBurstLimit: 3
          ThrottlingRateLimit: 1
        "POST /v2/identity/social-links":
          ThrottlingBurstLimit: 3
          ThrottlingRateLimit: 1
        "GET /v2/identity/social-links/callback":
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 2
        "POST /v2/identity/social-links/callback":
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 2
      Auth:
        Authorizers:
          KaevoOwnerAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${KaevoUserPool}
              audience:
                - !Ref KaevoUserPoolClient
                - !If [HasNativeOidc, !Ref KaevoSecurityStageNativeOidcClient, !Ref AWS::NoValue]
            IdentitySource: "$request.header.Authorization"
          KaevoEnrollmentAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${KaevoUserPool}
              audience:
                - !Ref KaevoEnrollmentUserPoolClient
                - !If [HasNativeOidc, !Ref KaevoSecurityStageNativeOidcClient, !Ref AWS::NoValue]
            IdentitySource: "$request.header.Authorization"

  KaevoProfileEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kaevo-cloud-dev-profile-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: profile_id
          AttributeType: S
        - AttributeName: event_key
          AttributeType: S
      KeySchema:
        - AttributeName: profile_id
          KeyType: HASH
        - AttributeName: event_key
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  KaevoProfileSettingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kaevo-cloud-dev-profile-settings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: profile_id
          AttributeType: S
      KeySchema:
        - AttributeName: profile_id
          KeyType: HASH

  KaevoDevicesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kaevo-cloud-dev-devices
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
        - AttributeName: profile_id
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: profile_id-updated_at-index
          KeySchema:
            - AttributeName: profile_id
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
  KaevoEntitlementsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kaevo-cloud-dev-entitlements
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: profile_id
          AttributeType: S
      KeySchema:
        - AttributeName: profile_id
          KeyType: HASH

  KaevoAppSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kaevo-cloud-dev-app-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token_hash
          AttributeType: S
        - AttributeName: family_id
          AttributeType: S
        - AttributeName: created_at_epoch
          AttributeType: N
        - !If
          - HasInstallationSessionIndex
          - AttributeName: installation_id
            AttributeType: S
          - !Ref AWS::NoValue
      KeySchema:
        - AttributeName: token_hash
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: family_id-created_at_epoch-index
          KeySchema:
            - AttributeName: family_id
              KeyType: HASH
            - AttributeName: created_at_epoch
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - !If
          - HasInstallationSessionIndex
          - IndexName: installation_id-created_at_epoch-index
            KeySchema:
              - AttributeName: installation_id
                KeyType: HASH
              - AttributeName: created_at_epoch
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - !Ref AWS::NoValue
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  KaevoPrincipalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub kaevo-cloud-${EnvironmentName}-principals
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: principal_id
          AttributeType: S
      KeySchema:
        - AttributeName: principal_id
          KeyType: HASH

  KaevoAccountsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub kaevo-cloud-${EnvironmentName}-accounts
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: account_id
          AttributeType: S
      KeySchema:
        - AttributeName: account_id
          KeyType: HASH
      Tags:
        - Key: KaevoDataClass
          Value: identity-authority

  KaevoAuthIdentitiesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub kaevo-cloud-${EnvironmentName}-auth-identities
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: auth_identity_key
          AttributeType: S
        - AttributeName: account_id
          AttributeType: S
        - AttributeName: created_at_epoch
          AttributeType: N
      KeySchema:
        - AttributeName: auth_identity_key
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: account_id-created_at_epoch-index
          KeySchema:
            - AttributeName: account_id
              KeyType: HASH
            - AttributeName: created_at_epoch
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: KaevoDataClass
          Value: identity-authority

  KaevoIdentityMembershipsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub kaevo-cloud-${EnvironmentName}-identity-memberships
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: principal_id
          AttributeType: S
      KeySchema:
        - AttributeName: principal_id
          KeyType: HASH
      Tags:
        - Key: KaevoDataClass
          Value: identity-authority

  KaevoHouseholdMembershipsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub kaevo-cloud-${EnvironmentName}-household-memberships
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: household_id
          AttributeType: S
        - AttributeName: membership_id
          AttributeType: S
        - AttributeName: account_id
          AttributeType: S
        - AttributeName: updated_at_epoch
          AttributeType: N
      KeySchema:
        - AttributeName: household_id
          KeyType: HASH
        - AttributeName: membership_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: account_id-updated_at_epoch-index
          KeySchema:
            - AttributeName: account_id
              KeyType: HASH
            - AttributeName: updated_at_epoch
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: KaevoDataClass
          Value: identity-authority

  KaevoProfilesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub kaevo-cloud-${EnvironmentName}-profiles
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: profile_id
          AttributeType: S
        - AttributeName: household_id
          AttributeType: S
        - AttributeName: created_at_epoch
          AttributeType: N
      KeySchema:
        - AttributeName: profile_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: household_id-created_at_epoch-index
          KeySchema:
            - AttributeName: household_id
              KeyType: HASH
            - AttributeName: created_at_epoch
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: KaevoDataClass
          Value: identity-authority

  KaevoProfileBindingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub kaevo-cloud-${EnvironmentName}-profile-bindings
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: account_id
          AttributeType: S
        - AttributeName: profile_id
          AttributeType: S
      KeySchema:
        - AttributeName: account_id
          KeyType: HASH
        - AttributeName: profile_id
          KeyType: RANGE
      Tags:
        - Key: KaevoDataClass
          Value: identity-authority

  KaevoProfileMappingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub kaevo-cloud-${EnvironmentName}-profile-mappings
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: installation_id
          AttributeType: S
        - AttributeName: local_profile_source_id
          AttributeType: S
      KeySchema:
        - AttributeName: installation_id
          KeyType: HASH
        - AttributeName: local_profile_source_id
          KeyType: RANGE
      Tags:
        - Key: KaevoDataClass
          Value: identity-authority

  KaevoIdentityHouseholdsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub kaevo-cloud-${EnvironmentName}-identity-households
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: household_id
          AttributeType: S
      KeySchema:
        - AttributeName: household_id
          KeyType: HASH
      Tags:
        - Key: KaevoDataClass
          Value: identity-authority

  KaevoIdentityProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub kaevo-cloud-${EnvironmentName}-identity-profiles
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: profile_id
          AttributeType: S
      KeySchema:
        - AttributeName: profile_id
          KeyType: HASH
      Tags:
        - Key: KaevoDataClass
          Value: identity-authority

  KaevoHouseholdInvitationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub kaevo-cloud-${EnvironmentName}-household-invitations
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: code_hash
          AttributeType: S
        - AttributeName: household_id
          AttributeType: S
      KeySchema:
        - AttributeName: code_hash
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: household_id-index
          KeySchema:
            - AttributeName: household_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: KaevoDataClass
          Value: short-lived-household-invitation

  KaevoHouseholdJoinTransactionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub kaevo-cloud-${EnvironmentName}-household-join-transactions
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: join_resume_hash
          AttributeType: S
        - AttributeName: invitation_id
          AttributeType: S
        - AttributeName: created_at_epoch
          AttributeType: N
      KeySchema:
        - AttributeName: join_resume_hash
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: invitation_id-created_at_epoch-index
          KeySchema:
            - AttributeName: invitation_id
              KeyType: HASH
            - AttributeName: created_at_epoch
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      TimeToLiveSpecification:
        AttributeName: cleanup_at
        Enabled: true
      Tags:
        - Key: KaevoDataClass
          Value: short-lived-household-join-routing

  KaevoInstallationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub kaevo-cloud-${EnvironmentName}-installations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: installation_id
          AttributeType: S
        - AttributeName: household_id
          AttributeType: S
        - AttributeName: created_at_epoch
          AttributeType: N
      KeySchema:
        - AttributeName: installation_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: household_id-created_at_epoch-index
          KeySchema:
            - AttributeName: household_id
              KeyType: HASH
            - AttributeName: created_at_epoch
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  KaevoSecurityAuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub kaevo-cloud-${EnvironmentName}-security-audit
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: household_id
          AttributeType: S
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: household_id
          KeyType: HASH
        - AttributeName: event_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  KaevoAuditReferenceSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub kaevo-cloud-${EnvironmentName}-audit-reference-promotion-v2
      Description: Environment-scoped HMAC key for privacy-safe security-audit references
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: KaevoDataClass
          Value: security-audit-reference-key

  # A generated 43-character base64url-compatible value decodes to a 32-byte
  # Ed25519 seed. The seed is never a SAM parameter, output, or source value.
  # This follows the existing environment-scoped Secrets Manager convention.
  KaevoPairingV3AuthorizationSigningSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub kaevo-cloud-${EnvironmentName}-pairing-v3-authorization-signing-seed
      Description: Dev-scoped Ed25519 seed for Pairing V3 authorization signing
      GenerateSecretString:
        PasswordLength: 43
        ExcludePunctuation: true
      Tags:
        - Key: KaevoDataClass
          Value: pairing-v3-authorization-signing-key

  KaevoHomeConnectorsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kaevo-cloud-dev-home-connectors
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connector_id
          AttributeType: S
        - AttributeName: profile_id
          AttributeType: S
        - AttributeName: household_id
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
      KeySchema:
        - AttributeName: connector_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: profile_id-updated_at-index
          KeySchema:
            - AttributeName: profile_id
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: household_id-updated_at-index
          KeySchema:
            - AttributeName: household_id
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  KaevoRemoteRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kaevo-cloud-dev-remote-requests
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S
        - AttributeName: connector_id
          AttributeType: S
        - AttributeName: status_created_at
          AttributeType: S
      KeySchema:
        - AttributeName: request_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      GlobalSecondaryIndexes:
        - IndexName: connector_id-status_created_at-index
          KeySchema:
            - AttributeName: connector_id
              KeyType: HASH
            - AttributeName: status_created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  KaevoBindingOperationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub kaevo-cloud-${EnvironmentName}-binding-operations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: operation_id
          AttributeType: S
      KeySchema:
        - AttributeName: operation_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  KaevoProfileBindingTombstonesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub kaevo-cloud-${EnvironmentName}-profile-binding-tombstones
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: profile_id
          AttributeType: S
      KeySchema:
        - AttributeName: profile_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  KaevoRemotePayloadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRemotePayloads
            Status: Enabled
            ExpirationInDays: 1

  KaevoProfileAvatarsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldAvatarVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  KaevoIdentityClaimIssuerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub kaevo-cloud-${EnvironmentName}-identity-claim-issuer
      CodeUri: ../api/src/
      Handler: claim_issuer.lambda_handler
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          PRINCIPALS_TABLE: !Ref KaevoPrincipalsTable
          IDENTITY_MEMBERSHIPS_TABLE: !Ref KaevoIdentityMembershipsTable
          IDENTITY_HOUSEHOLDS_TABLE: !Ref KaevoIdentityHouseholdsTable
          IDENTITY_PROFILES_TABLE: !Ref KaevoIdentityProfilesTable
          EXPECTED_USER_POOL_NAME: !Sub kaevo-cloud-${EnvironmentName}-users
          EXPECTED_MAIN_CLIENT_NAME: !Sub kaevo-cloud-${EnvironmentName}-ios-tvos
          EXPECTED_ENROLLMENT_CLIENT_NAME: !Sub kaevo-cloud-${EnvironmentName}-owner-enrollment
          EXPECTED_NATIVE_CLIENT_NAME: !If
            - IsSecurityStage
            - kaevo-security-stage-native-oidc
            - !If [IsDevelopment, kaevo-cloud-dev-native-oidc, ""]
          EXPECTED_NATIVE_CALLBACK_URI: !If
            - IsSecurityStage
            - kaevo-security-stage://oauth/callback
            - !If [IsDevelopment, kaevo://oauth/callback, ""]
          EXPECTED_NATIVE_LOGOUT_URI: !If
            - IsSecurityStage
            - kaevo-security-stage://oauth/logout
            - !If [IsDevelopment, kaevo://oauth/logout, ""]
          EXPECTED_NATIVE_GOOGLE_ENABLED: !If [HasGoogleIdentityProvider, "true", "false"]
          EXPECTED_NATIVE_APPLE_ENABLED: !If [HasAppleIdentityProvider, "true", "false"]
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: ReadAuthoritativeIdentityGraph
              Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !GetAtt KaevoPrincipalsTable.Arn
                - !GetAtt KaevoIdentityMembershipsTable.Arn
                - !GetAtt KaevoIdentityHouseholdsTable.Arn
                - !GetAtt KaevoIdentityProfilesTable.Arn
            - Sid: ValidateInvokingCognitoPoolAndClient
              Effect: Allow
              Action:
                - cognito-idp:DescribeUserPool
                - cognito-idp:DescribeUserPoolClient
              Resource: "*"
      Tags:
        KaevoSecurityBoundary: identity-claim-issuer

  KaevoIdentityClaimIssuerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/kaevo-cloud-${EnvironmentName}-identity-claim-issuer-promotion-v2
      RetentionInDays: 30

  KaevoUserPool:
    Type: AWS::Cognito::UserPool
    DependsOn:
      - KaevoIdentityClaimIssuerPermission
      - KaevoSocialIdentityGuardPermission
    Properties:
      UserPoolName: !Sub kaevo-cloud-${EnvironmentName}-users
      LambdaConfig:
        PreSignUp: !If [HasSocialIdentityProvider, !GetAtt KaevoSocialIdentityGuardFunction.Arn, !Ref AWS::NoValue]
        PreTokenGenerationConfig:
          LambdaArn: !GetAtt KaevoIdentityClaimIssuerFunction.Arn
          LambdaVersion: V2_0
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: "OFF"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  KaevoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub kaevo-cloud-${EnvironmentName}-ios-tvos
      UserPoolId: !Ref KaevoUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  KaevoEnrollmentUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub kaevo-cloud-${EnvironmentName}-owner-enrollment
      UserPoolId: !Ref KaevoUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_AUTH
      AccessTokenValidity: 5
      IdTokenValidity: 5
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      EnableTokenRevocation: true
      ReadAttributes:
        - email
        - email_verified
      WriteAttributes:
        - email

  KaevoSecurityStageNativeOidcClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: HasNativeOidc
    Properties:
      ClientName: !If [IsSecurityStage, kaevo-security-stage-native-oidc, kaevo-cloud-dev-native-oidc]
      UserPoolId: !Ref KaevoUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_AUTH
        # The Kaevo app uses this public-client flow for its first-party,
        # native email/password screens. It does not expose a client secret
        # and does not alter the managed-login OAuth code flow used by social
        # providers.
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
      SupportedIdentityProviders:
        - COGNITO
        - !If [HasGoogleIdentityProvider, !Ref KaevoGoogleIdentityProvider, !Ref AWS::NoValue]
        - !If [HasAppleIdentityProvider, !Ref KaevoAppleIdentityProvider, !Ref AWS::NoValue]
      CallbackURLs:
        - !If [IsSecurityStage, kaevo-security-stage://oauth/callback, kaevo://oauth/callback]
      LogoutURLs:
        - !If [IsSecurityStage, kaevo-security-stage://oauth/logout, kaevo://oauth/logout]
      DefaultRedirectURI: !If [IsSecurityStage, kaevo-security-stage://oauth/callback, kaevo://oauth/callback]
      AccessTokenValidity: 5
      IdTokenValidity: 5
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      EnableTokenRevocation: true

  KaevoGoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogleIdentityProvider
    Properties:
      UserPoolId: !Ref KaevoUserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        authorize_scopes: profile email openid
        client_id: !Sub '{{resolve:secretsmanager:${GoogleIdentityProviderSecretArn}:SecretString:client_id}}'
        client_secret: !Sub '{{resolve:secretsmanager:${GoogleIdentityProviderSecretArn}:SecretString:client_secret}}'
      AttributeMapping:
        email: email
        # Cognito marks a mapped federated email as unverified unless the
        # provider's verification claim is mapped explicitly. The pre-sign-up
        # guard rejects an unverified Google identity, so retain this mapping
        # as part of the provider contract.
        email_verified: email_verified

  KaevoAppleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasAppleIdentityProvider
    Properties:
      UserPoolId: !Ref KaevoUserPool
      ProviderName: SignInWithApple
      ProviderType: SignInWithApple
      ProviderDetails:
        authorize_scopes: email name
        client_id: !Sub '{{resolve:secretsmanager:${AppleIdentityProviderSecretArn}:SecretString:client_id}}'
        team_id: !Sub '{{resolve:secretsmanager:${AppleIdentityProviderSecretArn}:SecretString:team_id}}'
        key_id: !Sub '{{resolve:secretsmanager:${AppleIdentityProviderSecretArn}:SecretString:key_id}}'
        private_key: !Sub '{{resolve:secretsmanager:${AppleIdentityProviderSecretArn}:SecretString:private_key}}'
      AttributeMapping:
        email: email

  KaevoSecurityStageUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: HasNativeOidc
    Properties:
      UserPoolId: !Ref KaevoUserPool
      Domain: !If [IsSecurityStage, kaevo-security-stage-48c1664d38f4, kaevo-cloud-dev-295055514343-us-west-2]
      ManagedLoginVersion: 2

  KaevoCustomUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: HasCognitoCustomDomain
    Properties:
      UserPoolId: !Ref KaevoUserPool
      Domain: !Ref CognitoCustomDomainName
