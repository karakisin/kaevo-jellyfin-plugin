          PAIRING_V3_AUTHORIZATION_SIGNING_SEED: !Sub '{{resolve:secretsmanager:${KaevoPairingV3AuthorizationSigningSecret}:SecretString}}'
          PAIRING_V3_AUTHORIZATION_KEY_ID: v3-dev-20260722-1
          PLAYBACK_GRANT_SIGNING_KEY: !Ref PlaybackGrantSigningKey
          PLAYBACK_RELAY_PUBLIC_URL: !Ref PlaybackRelayPublicUrl
          EXPECTED_COGNITO_ISSUER: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${KaevoUserPool}
          EXPECTED_MAIN_CLIENT_ID: !Ref KaevoUserPoolClient
          EXPECTED_NATIVE_CLIENT_ID: !If [HasNativeOidc, !Ref KaevoSecurityStageNativeOidcClient, ""]
          COGNITO_USER_POOL_ID: !Ref KaevoUserPool
          GOOGLE_IDENTITY_PROVIDER_SECRET_ARN: !If [HasGoogleIdentityProvider, !Ref GoogleIdentityProviderSecretArn, ""]
          APPLE_IDENTITY_PROVIDER_SECRET_ARN: !If [HasAppleIdentityProvider, !Ref AppleIdentityProviderSecretArn, ""]
          SOCIAL_IDENTITY_LINK_CALLBACK_URL: !Ref SocialIdentityLinkCallbackUrl
          PUBLIC_API_BASE_URL: !If
            - HasApiCustomDomain
            - !Sub https://${ApiCustomDomainName}
            - !Sub https://${KaevoCloudHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoProfileEventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoProfileSettingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoDevicesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoEntitlementsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoHomeConnectorsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoRemoteRequestsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoBindingOperationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoProfileBindingTombstonesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoAppSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoAccountsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoAuthIdentitiesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KaevoHouseholdMembershipsTable
        # The roster projection is a protected, read-only identity endpoint.
        # Keep this explicit Query grant alongside the broader legacy CRUD
        # policy so a future transform or role-policy recovery cannot remove
        # the exact permission used to resolve canonical household members.
        - Statement:
            - Sid: ReadCanonicalHouseholdMembershipRoster
