  KaevoHouseholdJoinLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/kaevo-cloud-${EnvironmentName}-household-join
      RetentionInDays: 30

  KaevoHouseholdJoinFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub kaevo-cloud-${EnvironmentName}-household-join
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: KaevoHouseholdJoinLeastPrivilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kaevo-cloud-${EnvironmentName}-household-join:*
              - Sid: ReadAndTransitionJoinTransactions
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt KaevoHouseholdJoinTransactionsTable.Arn
              - Sid: ReadInvitationAndOnboardingAuthority
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  - !GetAtt KaevoHouseholdInvitationsTable.Arn
                  - !GetAtt KaevoPrincipalsTable.Arn
                  - !GetAtt KaevoIdentityMembershipsTable.Arn
                  - !GetAtt KaevoIdentityProfilesTable.Arn
                  - !GetAtt KaevoEntitlementsTable.Arn
                  - !GetAtt KaevoAccountsTable.Arn
                  - !GetAtt KaevoAuthIdentitiesTable.Arn
                  - !GetAtt KaevoHouseholdMembershipsTable.Arn
                  - !GetAtt KaevoProfilesTable.Arn
                  - !GetAtt KaevoProfileBindingsTable.Arn
                  - !GetAtt KaevoProfileMappingsTable.Arn
                  - !GetAtt KaevoIdentityHouseholdsTable.Arn
              - Sid: ReadActiveHouseholdCloudSeats
                Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !GetAtt KaevoHouseholdMembershipsTable.Arn
              - Sid: AtomicallyAdvanceHouseholdJoinOnboarding
                Effect: Allow
                Action:
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt KaevoHouseholdJoinTransactionsTable.Arn
                  - !GetAtt KaevoHouseholdInvitationsTable.Arn
                  - !GetAtt KaevoPrincipalsTable.Arn
                  - !GetAtt KaevoIdentityMembershipsTable.Arn
                  - !GetAtt KaevoIdentityProfilesTable.Arn
                  - !GetAtt KaevoEntitlementsTable.Arn
                  - !GetAtt KaevoIdentityHouseholdsTable.Arn
                  - !GetAtt KaevoAccountsTable.Arn
                  - !GetAtt KaevoAuthIdentitiesTable.Arn
                  - !GetAtt KaevoHouseholdMembershipsTable.Arn
                  - !GetAtt KaevoProfilesTable.Arn
                  - !GetAtt KaevoProfileBindingsTable.Arn
                  - !GetAtt KaevoProfileMappingsTable.Arn
              # DynamoDB authorizes the individual writes inside a transaction.
              # The Join table's own PutItem/UpdateItem statement covers the
              # pending pointer and transaction state; this statement covers
              # only the four additional completion writes and only in a
              # TransactWriteItems call.
              - Sid: PutHouseholdJoinCompletionRecordsTransactionally
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt KaevoHouseholdInvitationsTable.Arn
                  - !GetAtt KaevoAccountsTable.Arn
                  - !GetAtt KaevoAuthIdentitiesTable.Arn
                  - !GetAtt KaevoHouseholdMembershipsTable.Arn
                Condition:
                  StringEquals:
                    dynamodb:EnclosingOperation: TransactWriteItems
              # Profile Setup is a separate all-or-nothing transition.  Keep
              # its underlying DynamoDB authorizations distinct from Join
              # completion and confined to an enclosing transaction.
              - Sid: PutProfileSetupRecordsTransactionally
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt KaevoIdentityProfilesTable.Arn
                  - !GetAtt KaevoProfilesTable.Arn
                  - !GetAtt KaevoProfileBindingsTable.Arn
                  - !GetAtt KaevoProfileMappingsTable.Arn
                  - !GetAtt KaevoEntitlementsTable.Arn
                  - !GetAtt KaevoPrincipalsTable.Arn
                  - !GetAtt KaevoIdentityMembershipsTable.Arn
                Condition:
                  StringEquals:
                    dynamodb:EnclosingOperation: TransactWriteItems
              - Sid: ActivatePendingProfileMembershipTransactionally
                Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !GetAtt KaevoHouseholdMembershipsTable.Arn
                Condition:
                  StringEquals:
                    dynamodb:EnclosingOperation: TransactWriteItems
              - Sid: ReserveHouseholdCloudSeatTransactionally
                Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !GetAtt KaevoIdentityHouseholdsTable.Arn
                Condition:
                  StringEquals:
                    dynamodb:EnclosingOperation: TransactWriteItems
              - Sid: ResolveAuthenticatedSubjectOnly
                Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                Resource: !GetAtt KaevoUserPool.Arn
  KaevoHouseholdJoinFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - KaevoHouseholdJoinLogGroup
    Properties:
      FunctionName: !Sub kaevo-cloud-${EnvironmentName}-household-join
      CodeUri: ../api/src/
      Handler: household_join_handler.lambda_handler
      Role: !GetAtt KaevoHouseholdJoinFunctionRole.Arn
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          HOUSEHOLD_JOIN_TRANSACTIONS_TABLE: !Ref KaevoHouseholdJoinTransactionsTable
          HOUSEHOLD_INVITATIONS_TABLE: !Ref KaevoHouseholdInvitationsTable
          PRINCIPALS_TABLE: !Ref KaevoPrincipalsTable
          IDENTITY_MEMBERSHIPS_TABLE: !Ref KaevoIdentityMembershipsTable
          IDENTITY_PROFILES_TABLE: !Ref KaevoIdentityProfilesTable
          IDENTITY_HOUSEHOLDS_TABLE: !Ref KaevoIdentityHouseholdsTable
          ACCOUNTS_TABLE: !Ref KaevoAccountsTable
          AUTH_IDENTITIES_TABLE: !Ref KaevoAuthIdentitiesTable
          HOUSEHOLD_MEMBERSHIPS_TABLE: !Ref KaevoHouseholdMembershipsTable
          CLOUD_PROFILES_TABLE: !Ref KaevoProfilesTable
          PROFILE_BINDINGS_TABLE: !Ref KaevoProfileBindingsTable
          PROFILE_MAPPINGS_TABLE: !Ref KaevoProfileMappingsTable
          ENTITLEMENTS_TABLE: !Ref KaevoEntitlementsTable
          COGNITO_USER_POOL_ID: !Ref KaevoUserPool
          EXPECTED_COGNITO_ISSUER: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${KaevoUserPool}
          EXPECTED_NATIVE_CLIENT_ID: !If [HasNativeOidc, !Ref KaevoSecurityStageNativeOidcClient, ""]
          EXPECTED_NATIVE_CALLBACK_URI: !If [IsSecurityStage, kaevo-security-stage://oauth/callback, !If [IsDevelopment, kaevo://oauth/callback, ""]]
          # The app exchanges the authorization code against its configured
          # custom domain.  The browser handoff must use that same domain;
          # otherwise Cognito rejects the cross-domain code redemption after
          # a successful managed-login callback.
          NATIVE_OIDC_AUTHORIZATION_ENDPOINT: !If [HasCognitoCustomDomain, !Sub "https://${CognitoCustomDomainName}/oauth2/authorize", !If [IsSecurityStage, https://kaevo-security-stage-48c1664d38f4.auth.us-west-2.amazoncognito.com/oauth2/authorize, !If [IsDevelopment, https://kaevo-cloud-dev-295055514343-us-west-2.auth.us-west-2.amazoncognito.com/oauth2/authorize, ""]]]
          PUBLIC_API_BASE_URL: !If
            - HasApiCustomDomain
            - !Sub https://${ApiCustomDomainName}
            - !Sub https://${KaevoCloudHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}
          HOUSEHOLD_JOIN_AUTHORIZE_BASE_URL: !If
            - HasApiCustomDomain
            - !Sub https://${ApiCustomDomainName}/v3/identity/household-joins/authorize
            - !Sub https://${KaevoCloudHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}/v3/identity/household-joins/authorize
  KaevoHouseholdJoinIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref KaevoCloudHttpApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      PayloadFormatVersion: "2.0"
      IntegrationUri: !Sub
        - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
        - FunctionArn: !GetAtt KaevoHouseholdJoinFunction.Arn

  KaevoHouseholdJoinAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref KaevoCloudHttpApi
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${KaevoUserPool}
        Audience:
          - !If [HasNativeOidc, !Ref KaevoSecurityStageNativeOidcClient, !Ref KaevoUserPoolClient]
      Name: !Sub kaevo-cloud-${EnvironmentName}-household-join

  KaevoHouseholdJoinInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref KaevoHouseholdJoinFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${KaevoCloudHttpApi}/*/*/v3/identity/household-joins/*

  KaevoHouseholdJoinBeginRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref KaevoCloudHttpApi
      AuthorizationType: NONE
      RouteKey: POST /v3/identity/household-joins/begin
      Target: !Join ["/", [integrations, !Ref KaevoHouseholdJoinIntegration]]

