      Target: !Join ["/", [integrations, !Ref KaevoHouseholdJoinIntegration]]

  # An invitation-bound, rate-limited account route lookup. It returns only
  # the next native form and never changes household, account, or join state.
  KaevoHouseholdJoinResolveEmailRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref KaevoCloudHttpApi
      AuthorizationType: NONE
      RouteKey: POST /v3/identity/household-joins/resolve-email
      Target: !Join ["/", [integrations, !Ref KaevoHouseholdJoinIntegration]]

  KaevoHouseholdJoinAuthorizeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref KaevoCloudHttpApi
      AuthorizationType: NONE
      RouteKey: GET /v3/identity/household-joins/authorize
      Target: !Join ["/", [integrations, !Ref KaevoHouseholdJoinIntegration]]

  # The receipt is DPoP-, state-, and installation-bound in the Lambda. It
  # cannot use a JWT authorizer because it records failures before a valid
  # access token exists; it performs no identity or household mutation.
  KaevoHouseholdJoinAuthResultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref KaevoCloudHttpApi
      AuthorizationType: NONE
      RouteKey: POST /v3/identity/household-joins/auth-result
      Target: !Join ["/", [integrations, !Ref KaevoHouseholdJoinIntegration]]

  KaevoHouseholdJoinCompleteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref KaevoCloudHttpApi
      AuthorizationType: JWT
      AuthorizerId: !Ref KaevoHouseholdJoinAuthorizer
      RouteKey: POST /v3/identity/household-joins/complete
      Target: !Join ["/", [integrations, !Ref KaevoHouseholdJoinIntegration]]

  # Native email/password authentication presents a JWT directly to this
  # route. The Lambda still requires the exact invitation, installation, and
  # DPoP binding, and it accepts only a transaction that has not entered the
  # managed-login PKCE route.
  KaevoHouseholdJoinCompleteNativeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref KaevoCloudHttpApi
      AuthorizationType: JWT
      AuthorizerId: !Ref KaevoHouseholdJoinAuthorizer
      RouteKey: POST /v3/identity/household-joins/complete-native
      Target: !Join ["/", [integrations, !Ref KaevoHouseholdJoinIntegration]]

  KaevoHouseholdJoinOnboardingStatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref KaevoCloudHttpApi
      AuthorizationType: JWT
      AuthorizerId: !Ref KaevoHouseholdJoinAuthorizer
      RouteKey: GET /v3/identity/household-joins/onboarding-status
      Target: !Join ["/", [integrations, !Ref KaevoHouseholdJoinIntegration]]

  KaevoHouseholdJoinProfileSetupRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref KaevoCloudHttpApi
      AuthorizationType: JWT
      AuthorizerId: !Ref KaevoHouseholdJoinAuthorizer
      RouteKey: POST /v3/identity/household-joins/profile-setup
      Target: !Join ["/", [integrations, !Ref KaevoHouseholdJoinIntegration]]

  KaevoSocialIdentityApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/kaevo-cloud-${EnvironmentName}-social-identity-api
      RetentionInDays: 30

  KaevoSocialIdentityApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub kaevo-cloud-${EnvironmentName}-social-identity-api
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: KaevoSocialIdentityApiLeastPrivilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kaevo-cloud-${EnvironmentName}-social-identity-api:*
              - Sid: InvokeExactKaevoApiFunction
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt KaevoCloudApiFunction.Arn
      Tags:
        - Key: KaevoSecurityBoundary
          Value: social-identity-api-dispatch

  KaevoSocialIdentityApiFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - KaevoSocialIdentityApiLogGroup
    Properties:
      FunctionName: !Sub kaevo-cloud-${EnvironmentName}-social-identity-api
      CodeUri: ../api/social_identity_api/
      Handler: social_identity_dispatcher.lambda_handler
      Role: !GetAtt KaevoSocialIdentityApiFunctionRole.Arn
      Timeout: 20
      MemorySize: 128
      Environment:
        Variables:
          TARGET_FUNCTION_NAME: !Ref KaevoCloudApiFunction
      Events:
        ListSocialIdentityLinks:
          Type: HttpApi
          Properties:
            ApiId: !Ref KaevoCloudHttpApi
            Path: /v2/identity/social-links
            Method: GET
        StartSocialIdentityLink:
          Type: HttpApi
          Properties:
            ApiId: !Ref KaevoCloudHttpApi
            Path: /v2/identity/social-links
            Method: POST
        SocialIdentityLinkCallbackGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref KaevoCloudHttpApi
            Path: /v2/identity/social-links/callback
            Method: GET
        SocialIdentityLinkCallbackPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref KaevoCloudHttpApi
            Path: /v2/identity/social-links/callback
            Method: POST
      Tags:
        KaevoSecurityBoundary: social-identity-api-dispatch

  KaevoV3ConnectorControlLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/kaevo-cloud-${EnvironmentName}-v3-connector-control
      RetentionInDays: 30

  KaevoV3ConnectorControlFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub kaevo-cloud-${EnvironmentName}-v3-connector-control
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: KaevoV3ConnectorControlLeastPrivilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kaevo-cloud-${EnvironmentName}-v3-connector-control:*
              - Sid: ReadAndUpdateV3ConnectorRecords
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt KaevoHomeConnectorsTable.Arn
              - Sid: ConsumeV3ConnectorRequestNonces
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt KaevoAppSessionsTable.Arn
              - Sid: ResolveAuthoritativeProfileBinding
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt KaevoIdentityProfilesTable.Arn
              - Sid: ReadAndTransitionRemoteRequestRecords
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt KaevoRemoteRequestsTable.Arn
              - Sid: MirrorBindingOperationLifecycle
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt KaevoBindingOperationsTable.Arn
              - Sid: QueryPendingRemoteRequestsByConnector
                Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !Sub ${KaevoRemoteRequestsTable.Arn}/index/connector_id-status_created_at-index
              - Sid: StoreBoundedRemoteResponses
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub ${KaevoRemotePayloadsBucket.Arn}/remote-responses/*
      Tags:
        - Key: KaevoSecurityBoundary
          Value: pairing-v3-connector-control

  KaevoV3ConnectorControlFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - KaevoV3ConnectorControlLogGroup
    Metadata:
      BuildMethod: makefile
      BuildArchitecture: arm64
    Properties:
      FunctionName: !Sub kaevo-cloud-${EnvironmentName}-v3-connector-control
      CodeUri: ../api/
      Handler: connector_control_handler.lambda_handler
      Role: !GetAtt KaevoV3ConnectorControlFunctionRole.Arn
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          KAEVO_ENV: !Ref EnvironmentName
          HOME_CONNECTORS_TABLE: !Ref KaevoHomeConnectorsTable
          REMOTE_REQUESTS_TABLE: !Ref KaevoRemoteRequestsTable
          BINDING_OPERATIONS_TABLE: !Ref KaevoBindingOperationsTable
          APP_SESSIONS_TABLE: !Ref KaevoAppSessionsTable
          IDENTITY_PROFILES_TABLE: !Ref KaevoIdentityProfilesTable
          REMOTE_PAYLOADS_BUCKET: !Ref KaevoRemotePayloadsBucket
          PLAYBACK_GRANT_SIGNING_KEY: !Ref PlaybackGrantSigningKey
          PLAYBACK_RELAY_PUBLIC_URL: !Ref PlaybackRelayPublicUrl
      Events:
        RegisterHomeConnectorV3:
          Type: HttpApi
          Properties:
            ApiId: !Ref KaevoCloudHttpApi
            Path: /v3/home-connectors/register
            Method: POST
        HeartbeatHomeConnectorV3:
          Type: HttpApi
          Properties:
            ApiId: !Ref KaevoCloudHttpApi
            Path: /v3/home-connectors/{connectorId}/heartbeat
            Method: POST
        DisconnectHomeConnectorV3:
          Type: HttpApi
          Properties:
            ApiId: !Ref KaevoCloudHttpApi
            Path: /v3/home-connectors/{connectorId}/disconnect
            Method: POST
        CreateConnectorRelayTicketV3:
          Type: HttpApi
          Properties:
            ApiId: !Ref KaevoCloudHttpApi
            Path: /v3/home-connectors/{connectorId}/relay-ticket
            Method: POST
        RemoteRequestClaimV3:
          Type: HttpApi
          Properties:
            ApiId: !Ref KaevoCloudHttpApi
            Path: /v3/remote-requests/claim
            Method: POST
        RemoteRequestCompleteV3:
          Type: HttpApi
          Properties:
            ApiId: !Ref KaevoCloudHttpApi
            Path: /v3/remote-requests/{requestId}/complete
            Method: POST
        RemoteRequestFailV3:
          Type: HttpApi
          Properties:
            ApiId: !Ref KaevoCloudHttpApi
            Path: /v3/remote-requests/{requestId}/fail
            Method: POST
      Tags:
        KaevoSecurityBoundary: pairing-v3-connector-control

